name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          RAW="${SUPABASE_PROJECT_REF}"
          if [[ "$RAW" == https://* ]]; then
            PROJECT_REF="$(echo "$RAW" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')"
          else
            PROJECT_REF="$RAW"
          fi
          supabase functions deploy --use-api --project-ref "$PROJECT_REF"
